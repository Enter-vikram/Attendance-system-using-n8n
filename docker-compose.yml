services:
  postgres:
    image: postgres:15-alpine
    container_name: attendance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: attendance123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d attendance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: attendance-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: attendance
      DB_USER: admin
      DB_PASSWORD: attendance123
      BASE_URL: ${BASE_URL:-http://localhost:4000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attendance-net

  n8n:
    image: n8nio/n8n:latest
    container_name: attendance-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: n8npassword123
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-YOUR_WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-YOUR_PHONE_NUMBER_ID}
      ATTENDANCE_BACKEND_URL: http://backend:4000
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend
    networks:
      - attendance-net

volumes:
  postgres_data:
  n8n_data:

networks:
  attendance-net:
    driver: bridge
